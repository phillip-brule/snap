{% extends "base.html" %}
{% block title %}Upload — SNAP Records{% endblock %}
{% block body %}
<h1>Upload content</h1>
<p class="hero-note">Band: {{ band.name }} · tape it to the wall</p>
<form method="post" enctype="multipart/form-data" class="panel">
  <label>Title</label>
  <input type="text" name="title" required>
  <label>Description</label>
  <textarea name="description"></textarea>
  <label>Section</label>
  <select name="category" required>
    {% for c in categories %}<option value="{{ c }}">{{ category_labels.get(c, c) }}</option>{% endfor %}
  </select>
  <label>Audience level</label>
  <select name="audience_level" required>
    {% for a in audiences %}<option value="{{ a }}">{{ a }}</option>{% endfor %}
  </select>
  <label>Available from (press)</label>
  <input type="datetime-local" name="available_from_press">
  <label>Available from (fans)</label>
  <input type="datetime-local" name="available_from_fans">
  <label>Contract amount (encrypted)</label>
  <input type="text" name="contract_amount" placeholder="optional">
  <label>Tour rider fee (encrypted)</label>
  <input type="text" name="rider_fee" placeholder="optional">
  <label>File</label>
  <input type="file" name="file" required>
  <button type="submit">
    <img class="btn-snap" src="{{ url_for('static', filename='inspo/snaps/snap_3.jpg') }}" alt="">
    Upload
  </button>
</form>
{% endblock %}
