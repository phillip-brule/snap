{% extends "base.html" %}
{% block title %}2FA — SNAP Records{% endblock %}
{% block body %}
<div class="panel auth-box">
  <h1>Authenticator code</h1>
  <p class="muted">Enter the 6-digit code from your authenticator app.</p>
  <form method="post">
    <label>Code</label>
    <input type="text" name="code" required inputmode="numeric" autocomplete="one-time-code" minlength="6" maxlength="6">
    <button type="submit">Verify</button>
  </form>
  <p class="hint"><a href="{{ url_for('auth.login') }}">Back to login</a></p>
</div>
{% endblock %}
