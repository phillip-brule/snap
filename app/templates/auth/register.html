{% extends "base.html" %}
{% block title %}Register — SNAP Records{% endblock %}
{% block body %}
<div class="panel auth-box">
  <h1>Fan registration</h1>
  <form method="post">
    <label>Display name</label>
    <input type="text" name="display_name" required>
    <label>Email</label>
    <input type="email" name="email" required>
    <label>Password</label>
    <input type="password" name="password" required minlength="8" maxlength="128" autocomplete="new-password">
    <button type="submit">
      <img class="btn-snap" src="{{ url_for('static', filename='inspo/snaps/snap_1.jpg') }}" alt="">
      Create account
    </button>
  </form>
  <p class="hint"><a href="{{ url_for('auth.login') }}">Back to login</a></p>
</div>
{% endblock %}
