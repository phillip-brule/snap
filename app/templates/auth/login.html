
{% extends "base.html" %}

{% block title %}Login to SNAP Records{% endblock %}

{% block body %}
<div class="panel auth-box">

  <h1>SNAP Records</h1>

  <p class="muted">
    Private label portal · Sign in to access your content.
  </p>

  <!-- Existing email/password login -->
  <form method="post"
        data-reaction="inspo/reactions/reaction_13.jpg">

    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      name="email"
      required
      autocomplete="username"
    >

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      name="password"
      required
      autocomplete="current-password"
    >

    <button type="submit">
      <img
        class="btn-snap"
        src="{{ url_for('static', filename='inspo/snaps/snap_1.jpg') }}"
        alt=""
      >
      Sign in
    </button>

  </form>

  <!-- Login separator -->
  <div class="oauth-divider">
    <span>OR</span>
  </div>

  <!-- Google OpenID Connect -->
  <a
    href="{{ url_for('auth.google_login') }}"
    class="google-login-btn"
  >
    <svg
      width="22"
      height="22"
      viewBox="0 0 48 48"
      aria-hidden="true"
    >
      <path fill="#EA4335"
        d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4"
        d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.24 5.48-4.74 7.18l7.73 6C44.44 38.03 46.98 31.87 46.98 24.55z"/>
      <path fill="#FBBC05"
        d="M10.53 28.59c-.48-1.44-.76-2.97-.76-4.59s.27-3.15.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853"
        d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>

    Continue with Google
  </a>

  <p class="hint">
    Fan?
    <a href="{{ url_for('auth.register') }}">
      Register
    </a>
  </p>

</div>
{% endblock %}
