{% extends "base.html" %}
{% block title %}Accept invite — SNAP Records{% endblock %}
{% block body %}
<div class="panel auth-box">
  <h1>Accept invitation</h1>
  <p class="muted">{{ invitation.email }} · role: {{ invitation.intended_role }}</p>
  <form method="post">
    <label>Display name</label>
    <input type="text" name="display_name" required>
    <label>Password</label>
    <input type="password" name="password" required minlength="8" maxlength="128" autocomplete="new-password">
    <button type="submit">Create professional account</button>
  </form>
</div>
{% endblock %}
