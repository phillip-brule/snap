secrets:
  content_kek:
    file: ./secrets/content_kek
  tls_server_key:
    file: ./secrets/server.key

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: snap
      POSTGRES_PASSWORD: snap
      POSTGRES_DB: snap_records
    # ponytail: no host 5432 publish — local postgres already owns it; web reaches db via compose network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snap -d snap_records"]
      interval: 3s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    secrets:
      - tls_server_key
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/fullchain.crt:/etc/nginx/certs/fullchain.crt:ro
    depends_on:
      - web

  web:
    build: .
    # only reachable through nginx (HTTPS); no host port published
    expose:
      - "5000"
    environment:
      FLASK_SECRET_KEY: dev-change-me
      BEHIND_PROXY: "1"
      DATABASE_URL: postgresql+psycopg2://snap:snap@db:5432/snap_records
      UPLOAD_FOLDER: /data/uploads
    secrets:
      - content_kek
    volumes:
      - uploads:/data/uploads
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
