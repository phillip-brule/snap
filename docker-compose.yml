secrets:
  content_kek:
    file: ./secrets/content_kek
  tls_server_key:
    file: ./secrets/server.key

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: snap
      POSTGRES_PASSWORD: snap
      POSTGRES_DB: snap_records
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snap -d snap_records"]
      interval: 3s
      timeout: 3s
      retries: 10

  # XACML 3.0 PDP/PAP. Internal network only: its REST API (incl. policy admin) is unauthenticated.
  authzforce:
    image: authzforce/server:12.1.0
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:8080/authzforce-ce/domains"]
      interval: 5s
      timeout: 3s
      retries: 30

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    secrets:
      - tls_server_key
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/fullchain.crt:/etc/nginx/certs/fullchain.crt:ro
    depends_on:
      - web

  web:
    build: .
    # only reachable through nginx (HTTPS); no host port published
    expose:
      - "5000"
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in .env}
      BEHIND_PROXY: "1"
      DATABASE_URL: postgresql+psycopg2://snap:snap@db:5432/snap_records
      UPLOAD_FOLDER: /data/uploads
      # Google OAuth / OpenID Connect
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
      # Content encryption
      CONTENT_KEK_PATH: /run/secrets/content_kek
      # Access control (XACML 3.0 PDP)
      AUTHZFORCE_URL: http://authzforce:8080
    secrets:
      - content_kek


    volumes:
      - uploads:/data/uploads
      - ./app:/app/app
      - ./authz:/app/authz:ro

    depends_on:
      db:
        condition: service_healthy
      authzforce:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
