# CI security checks, run on every push and pull request:
#   1. Gitleaks   - leaked private keys / secrets anywhere in the git history
#   2. OWASP ZAP  - starts the whole app (nginx + Flask + PostgreSQL + AuthzForce) and scans it
#                   over HTTPS; plus an exposed-routes test (every route must require login)
# "Run workflow" (manual) with scan = full adds ZAP's active attack scan.
name: Security checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scan:
        description: "ZAP scan type"
        type: choice
        options: [baseline, full]
        default: baseline

permissions:
  contents: read

env:
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.16.1
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.21.2

jobs:
  secrets:
    name: Leaked secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # whole history: a key deleted later is still leaked

      - name: Scan all commits for keys and secrets
        # run as the checkout owner, otherwise git refuses the repo and gitleaks
        # silently does a partial scan that reports "no leaks"
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            git /repo --redact --no-banner -v --exit-code 1

  zap:
    name: OWASP ZAP scan + exposed routes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Create throwaway keys, certificates and settings
        run: |
          bash kek_gen.sh
          bash certs_gen.sh
          {
            echo "FLASK_SECRET_KEY=$(openssl rand -hex 32)"
            echo "GOOGLE_CLIENT_ID=ci-dummy"
            echo "GOOGLE_CLIENT_SECRET=ci-dummy"
          } > .env

      - name: Start the application stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --cacert certs/snap-root-ca.crt https://localhost/login || true)
            [ "$code" = "200" ] && echo "app is up over HTTPS" && exit 0
            sleep 2
          done
          echo "::error::application did not start"; exit 1

      - name: Exposed routes check and test suite
        run: docker compose exec -T web sh -c "pip install -q pytest && python -m pytest -q tests"

      - name: OWASP ZAP ${{ inputs.scan || 'baseline' }} scan
        run: |
          plan="${{ inputs.scan == 'full' && 'full' || 'baseline' }}.yaml"
          mkdir -p .zap/report && chmod -R a+rwX .zap   # ZAP runs as uid 1000 in its container
          set +e
          docker run --rm --network host -v "$PWD/.zap:/zap/wrk" "$ZAP_IMAGE" \
            zap.sh -cmd -autorun "/zap/wrk/$plan"
          rc=$?
          set -e
          report=$(ls .zap/report/*.json 2>/dev/null | head -1)
          if [ -n "$report" ]; then
            python3 .zap/summary.py "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
          case $rc in
            0) echo "ZAP: no Medium/High alerts" ;;
            2) echo "::warning::ZAP raised Low-risk alerts (see job summary)" ;;
            *) echo "::error::ZAP found Medium/High-risk issues (see job summary and zap-report artifact)"; exit 1 ;;
          esac

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: .zap/report/
          if-no-files-found: ignore

      - name: Application logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
